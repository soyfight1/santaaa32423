<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizador de Datos Bancarios</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 1200px;
            width: 100%;
            padding: 40px;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .input-section, .output-section {
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #555;
            font-weight: 600;
            font-size: 1.1em;
        }

        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            resize: vertical;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .secondary-button {
            background: #f0f0f0;
            color: #333;
        }

        .secondary-button:hover {
            background: #e0e0e0;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
        }

        .output-container {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #e0e0e0;
            min-height: 300px;
            position: relative;
        }

        .output-content {
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            line-height: 1.6;
            color: #333;
        }

        .section-header {
            color: #667eea;
            font-weight: bold;
            border-bottom: 2px solid #667eea;
            padding-bottom: 5px;
            margin: 20px 0 10px 0;
        }

        .data-row {
            margin: 5px 0;
            padding: 5px 0;
        }

        .data-label {
            color: #555;
            font-weight: 600;
        }

        .data-value {
            color: #333;
        }

        .success-message {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #4caf50;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            display: none;
            animation: slideInRight 0.3s ease-out;
        }

        @keyframes slideInRight {
            from {
                transform: translateX(100%);
            }
            to {
                transform: translateX(0);
            }
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 50px;
        }

        .empty-state svg {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 2em;
            }
            
            .button-group {
                flex-direction: column;
            }
            
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💳 Organizador de Datos Bancarios</h1>
        <p class="subtitle">Pega los datos desordenados y los organizaré automáticamente</p>
        
        <div class="input-section">
            <label for="inputData">📋 Pega aquí los datos:</label>
            <textarea id="inputData" rows="6" placeholder="Ejemplo: 52898137T:09081994 | Nombre = ZUBIETA JIMENEZ PAULA MARIA | IBAN = ES 24 00491643712110197138..."></textarea>
        </div>
        
        <div class="button-group">
            <button onclick="organizarDatos()">✨ Organizar Datos</button>
            <button class="secondary-button" onclick="limpiarTodo()">🗑️ Limpiar Todo</button>
            <button class="secondary-button" onclick="cargarEjemplo()">📝 Cargar Ejemplo</button>
        </div>
        
        <div class="output-section">
            <label>📊 Datos Organizados:</label>
            <div class="output-container">
                <div id="outputData" class="output-content">
                    <div class="empty-state">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                        </svg>
                        <p>Los datos organizados aparecerán aquí</p>
                    </div>
                </div>
                <button id="copyButton" style="display:none; margin-top: 15px;" onclick="copiarAlPortapapeles()">📋 Copiar al Portapapeles</button>
            </div>
        </div>
    </div>
    
    <div class="success-message" id="successMessage">
        ✅ Copiado al portapapeles
    </div>

    <script>
        function parsearDatos(texto) {
            // Objeto para almacenar los datos parseados
            const datos = {};
            
            // Eliminar los dos puntos después del DNI
            texto = texto.replace(/^(\d{8}[A-Z]):(\d{8})/, '$1 $2');
            
            // Separar por pipes y procesar cada campo
            const campos = texto.split('|');
            
            campos.forEach(campo => {
                campo = campo.trim();
                
                // Buscar DNI al inicio
                const dniMatch = campo.match(/^(\d{8}[A-Z])\s+(\d{8})/);
                if (dniMatch) {
                    datos.dni = dniMatch[1];
                    datos.fechaDniNumero = dniMatch[2];
                    // Convertir fecha del DNI
                    const dia = dniMatch[2].substring(0, 2);
                    const mes = dniMatch[2].substring(2, 4);
                    const año = dniMatch[2].substring(4, 8);
                    datos.fechaNacimientoDNI = `${dia}/${mes}/${año}`;
                    return;
                }
                
                // Buscar pares clave = valor
                const parMatch = campo.match(/(.+?)\s*=\s*(.+)/);
                if (parMatch) {
                    const clave = parMatch[1].trim();
                    const valor = parMatch[2].trim();
                    
                    switch(clave.toLowerCase()) {
                        case 'nombre':
                            datos.nombre = valor;
                            break;
                        case 'iban':
                            datos.iban = valor.replace(/\s+/g, ' ').trim();
                            break;
                        case 'operativa':
                            datos.operativa = valor;
                            break;
                        case 'firma':
                            datos.firma = valor;
                            break;
                        case 'fechadenacimiento':
                            // Convertir formato de fecha
                            const fechaParts = valor.split('-');
                            if (fechaParts.length === 3) {
                                datos.fechaNacimiento = `${fechaParts[2]}/${fechaParts[1]}/${fechaParts[0]}`;
                            } else {
                                datos.fechaNacimiento = valor;
                            }
                            break;
                        case 'saldodisponible':
                            datos.saldo = valor;
                            break;
                        case 'tarjeta':
                            // Formatear número de tarjeta
                            datos.tarjeta = valor.match(/.{1,4}/g).join(' ');
                            break;
                        case 'exp':
                            datos.expiracion = valor;
                            break;
                        case 'limite':
                            datos.limite = valor;
                            break;
                        case 'phone':
                            // Formatear teléfono
                            const phoneClean = valor.replace(/\D/g, '');
                            if (phoneClean.length >= 9) {
                                const countryCode = phoneClean.substring(0, phoneClean.length - 9);
                                const phone = phoneClean.substring(phoneClean.length - 9);
                                datos.telefono = `+${countryCode} ${phone.substring(0,3)} ${phone.substring(3,6)} ${phone.substring(6)}`;
                            } else {
                                datos.telefono = valor;
                            }
                            break;
                        case 'prestamo':
                            // Parsear préstamos
                            const prestamosStr = valor.replace(/[\[\]]/g, '');
                            const prestamos = prestamosStr.split(',').map(p => p.trim());
                            datos.prestamos = prestamos;
                            // Calcular total
                            let total = 0;
                            prestamos.forEach(p => {
                                const montoMatch = p.match(/(\d+)/);
                                if (montoMatch) {
                                    total += parseInt(montoMatch[1]);
                                }
                            });
                            datos.totalPrestamos = `${total.toLocaleString('es-ES')} EUR`;
                            break;
                    }
                }
            });
            
            return datos;
        }
        
        function formatearDatosOrganizados(datos) {
            let resultado = '';
            
            // Sección de Información Personal
            resultado += '=====================================\n';
            resultado += 'INFORMACIÓN PERSONAL Y BANCARIA\n';
            resultado += '=====================================\n\n';
            
            if (datos.dni) {
                resultado += `DNI: ${datos.dni}`;
                if (datos.fechaDniNumero) {
                    resultado += ` ${datos.fechaDniNumero}`;
                }
                resultado += '\n';
            }
            
            if (datos.nombre) {
                resultado += `Nombre: ${datos.nombre}\n`;
            }
            
            if (datos.fechaNacimiento) {
                resultado += `Fecha de Nacimiento: ${datos.fechaNacimiento}\n`;
            }
            
            if (datos.telefono) {
                resultado += `Teléfono: ${datos.telefono}\n`;
            }
            
            // Sección Bancaria
            resultado += '\n=====================================\n';
            resultado += 'INFORMACIÓN BANCARIA\n';
            resultado += '=====================================\n\n';
            
            if (datos.iban) {
                // Formatear IBAN en grupos de 4
                const ibanLimpio = datos.iban.replace(/\s+/g, '');
                const ibanFormateado = ibanLimpio.match(/.{1,4}/g).join(' ');
                resultado += `IBAN: ${ibanFormateado}\n`;
            }
            
            if (datos.saldo) {
                resultado += `Saldo Disponible: ${datos.saldo}\n`;
            }
            
            if (datos.operativa) {
                resultado += `Estado Operativa: ${datos.operativa}\n`;
            }
            
            if (datos.firma) {
                resultado += `Estado Firma: ${datos.firma}\n`;
            }
            
            // Sección de Tarjeta
            if (datos.tarjeta || datos.expiracion || datos.limite) {
                resultado += '\n=====================================\n';
                resultado += 'INFORMACIÓN DE TARJETA\n';
                resultado += '=====================================\n\n';
                
                if (datos.tarjeta) {
                    resultado += `Número de Tarjeta: ${datos.tarjeta}\n`;
                }
                
                if (datos.expiracion) {
                    resultado += `Fecha de Expiración: ${datos.expiracion}\n`;
                }
                
                if (datos.limite) {
                    resultado += `Límite: ${datos.limite}\n`;
                }
            }
            
            // Sección de Préstamos
            if (datos.prestamos && datos.prestamos.length > 0) {
                resultado += '\n=====================================\n';
                resultado += 'PRÉSTAMOS\n';
                resultado += '=====================================\n\n';
                
                datos.prestamos.forEach((prestamo, index) => {
                    // Formatear el monto del préstamo
                    const montoMatch = prestamo.match(/(\d+)/);
                    if (montoMatch) {
                        const monto = parseInt(montoMatch[1]).toLocaleString('es-ES');
                        resultado += `Préstamo ${index + 1}: ${monto} EUR\n`;
                    } else {
                        resultado += `Préstamo ${index + 1}: ${prestamo}\n`;
                    }
                });
                
                if (datos.totalPrestamos) {
                    resultado += `Total Préstamos: ${datos.totalPrestamos}\n`;
                }
            }
            
            return resultado;
        }
        
        function organizarDatos() {
            const inputData = document.getElementById('inputData').value.trim();
            
            if (!inputData) {
                alert('Por favor, pega los datos que quieres organizar');
                return;
            }
            
            try {
                const datosParsed = parsearDatos(inputData);
                const datosOrganizados = formatearDatosOrganizados(datosParsed);
                
                document.getElementById('outputData').textContent = datosOrganizados;
                document.getElementById('copyButton').style.display = 'block';
                
                // Animación de éxito
                document.querySelector('.output-container').style.animation = 'none';
                setTimeout(() => {
                    document.querySelector('.output-container').style.animation = 'slideIn 0.5s ease-out';
                }, 10);
                
            } catch (error) {
                alert('Error al procesar los datos. Por favor, verifica el formato.');
                console.error(error);
            }
        }
        
        function copiarAlPortapapeles() {
            const outputData = document.getElementById('outputData').textContent;
            
            navigator.clipboard.writeText(outputData).then(() => {
                const successMsg = document.getElementById('successMessage');
                successMsg.style.display = 'block';
                setTimeout(() => {
                    successMsg.style.display = 'none';
                }, 3000);
            }).catch(err => {
                alert('Error al copiar al portapapeles');
                console.error(err);
            });
        }
        
        function limpiarTodo() {
            document.getElementById('inputData').value = '';
            document.getElementById('outputData').innerHTML = `
                <div class="empty-state">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                    <p>Los datos organizados aparecerán aquí</p>
                </div>
            `;
            document.getElementById('copyButton').style.display = 'none';
        }
        
        function cargarEjemplo() {
            const ejemplo = `52898137T:09081994 | Nombre = ZUBIETA JIMENEZ PAULA MARIA | IBAN = ES 24 00491643712110197138 | Operativa = Operativa | Firma = Activa | FechaDeNacimiento = 1994-08-09 | SaldoDisponible = +30.00 EUR | Tarjeta = 5163830305842926 | EXP = 08/2027 | Limite = 0 EUR | Phone = +34665395918 | PRESTAMO = [5000 EUR, 3000 EUR]`;
            document.getElementById('inputData').value = ejemplo;
            organizarDatos();
        }
        
        // Permitir organizar con Enter (Ctrl+Enter)
        document.getElementById('inputData').addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                organizarDatos();
            }
        });
    </script>
</body>
</html>
