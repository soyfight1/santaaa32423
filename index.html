<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizador de Datos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background-color: #000;
            color: #0f0;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            color: #0f0;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2em;
        }
        
        textarea {
            width: 100%;
            height: 150px;
            background: #111;
            color: #0f0;
            border: 2px solid #0f0;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 20px;
        }
        
        button {
            background: #0f0;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-right: 10px;
            margin-bottom: 20px;
        }
        
        button:hover {
            background: #0a0;
        }
        
        #resultado {
            background: #111;
            border: 2px solid #0f0;
            padding: 20px;
            margin-top: 20px;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
            min-height: 100px;
        }
        
        .error {
            color: #f00;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ORGANIZADOR DE DATOS BANCARIOS</h1>
        
        <textarea id="entrada" placeholder="Pega aquí los datos: 52898137T:09081994 | Nombre = ZUBIETA JIMENEZ PAULA MARIA | IBAN = ES 24 00491643712110197138..."></textarea>
        
        <div>
            <button onclick="procesar()">ORGANIZAR DATOS</button>
            <button onclick="limpiar()">LIMPIAR</button>
            <button onclick="copiar()">COPIAR RESULTADO</button>
            <button onclick="ejemplo()">CARGAR EJEMPLO</button>
        </div>
        
        <div id="error" class="error"></div>
        
        <div id="resultado"></div>
    </div>

    <script>
        function procesar() {
            const entrada = document.getElementById('entrada').value.trim();
            const resultado = document.getElementById('resultado');
            const error = document.getElementById('error');
            
            if (!entrada) {
                error.textContent = 'PEGA LOS DATOS PRIMERO';
                resultado.textContent = '';
                return;
            }
            
            error.textContent = '';
            
            try {
                // Quitar los : después del DNI
                let datos = entrada.replace(/^(\d{8}[A-Z]):(\d{8})/, '$1 $2');
                
                // Parsear los datos
                const campos = {};
                
                // DNI y fecha
                const dniMatch = datos.match(/^(\d{8}[A-Z])\s+(\d{8})/);
                if (dniMatch) {
                    campos.dni = dniMatch[1];
                    campos.fechaDni = dniMatch[2];
                }
                
                // Resto de campos
                const partes = datos.split('|');
                partes.forEach(parte => {
                    if (parte.includes('=')) {
                        const [clave, valor] = parte.split('=').map(s => s.trim());
                        campos[clave.toLowerCase().replace(/\s/g, '')] = valor;
                    }
                });
                
                // Formatear IBAN si existe
                if (campos.iban) {
                    const ibanLimpio = campos.iban.replace(/\s+/g, '');
                    campos.iban = ibanLimpio.match(/.{1,4}/g).join(' ');
                }
                
                // Formatear tarjeta si existe
                if (campos.tarjeta) {
                    const tarjetaLimpia = campos.tarjeta.replace(/\s+/g, '');
                    if (tarjetaLimpia.length >= 16) {
                        campos.tarjeta = tarjetaLimpia.match(/.{1,4}/g).join(' ');
                    }
                }
                
                // Calcular total préstamos si existe
                let totalPrestamos = 0;
                if (campos.prestamo) {
                    const prestamos = campos.prestamo.replace(/[\[\]]/g, '').split(',');
                    prestamos.forEach(p => {
                        const match = p.match(/(\d+)/);
                        if (match) totalPrestamos += parseInt(match[1]);
                    });
                }
                
                // Construir línea organizada
                let linea = '';
                
                if (campos.dni && campos.fechaDni) {
                    linea = `${campos.dni} ${campos.fechaDni}`;
                }
                
                if (campos.nombre) linea += ` | Nombre = ${campos.nombre}`;
                if (campos.iban) linea += ` | IBAN = ${campos.iban}`;
                if (campos.operativa) linea += ` | Operativa = ${campos.operativa}`;
                if (campos.firma) linea += ` | Firma = ${campos.firma}`;
                if (campos.fechadenacimiento) linea += ` | FechaDeNacimiento = ${campos.fechadenacimiento}`;
                if (campos.saldodisponible) linea += ` | SaldoDisponible = ${campos.saldodisponible}`;
                if (campos.tarjeta) linea += ` | Tarjeta = ${campos.tarjeta}`;
                if (campos.exp) linea += ` | EXP = ${campos.exp}`;
                if (campos.limite) linea += ` | Limite = ${campos.limite}`;
                if (campos.phone) linea += ` | Phone = ${campos.phone}`;
                if (campos.prestamo) {
                    linea += ` | PRESTAMO = ${campos.prestamo}`;
                    if (totalPrestamos > 0) {
                        linea += ` | TOTAL = ${totalPrestamos.toLocaleString('es-ES')} EUR`;
                    }
                }
                
                // Mostrar resultado
                resultado.textContent = linea;
                
            } catch (e) {
                error.textContent = 'ERROR AL PROCESAR LOS DATOS';
                console.error(e);
            }
        }
        
        function limpiar() {
            document.getElementById('entrada').value = '';
            document.getElementById('resultado').textContent = '';
            document.getElementById('error').textContent = '';
        }
        
        function copiar() {
            const resultado = document.getElementById('resultado').textContent;
            if (resultado) {
                navigator.clipboard.writeText(resultado).then(() => {
                    document.getElementById('error').textContent = '';
                    alert('COPIADO AL PORTAPAPELES');
                }).catch(() => {
                    alert('ERROR AL COPIAR');
                });
            } else {
                document.getElementById('error').textContent = 'NO HAY NADA QUE COPIAR';
            }
        }
        
        function ejemplo() {
            document.getElementById('entrada').value = '52898137T:09081994 | Nombre = ZUBIETA JIMENEZ PAULA MARIA | IBAN = ES 24 00491643712110197138 | Operativa = Operativa | Firma = Activa | FechaDeNacimiento = 1994-08-09 | SaldoDisponible = +30.00 EUR | Tarjeta = 5163830305842926 | EXP = 08/2027 | Limite = 0 EUR | Phone = +34665395918 | PRESTAMO = [5000 EUR, 3000 EUR]';
            procesar();
        }
        
        // Procesar automáticamente al pegar
        document.getElementById('entrada').addEventListener('paste', function() {
            setTimeout(procesar, 100);
        });
    </script>
</body>
</html>
